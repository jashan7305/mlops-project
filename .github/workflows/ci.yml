name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "joblib>=1.6.0" "numpy>=2.4.6" "pandas>=3.1.0" "scikit-learn>=1.9.1" "streamlit>=1.66.1"

      - name: Validate application
        run: |
          python -m py_compile main.py
          python - <<'PY'
          import joblib
          import pandas as pd

          model = joblib.load("models/iris_extra_trees_model.joblib")
          sample = pd.DataFrame(
              [[5.1, 3.5, 1.4, 0.2]],
              columns=["SepalLengthCm", "SepalWidthCm", "PetalLengthCm", "PetalWidthCm"],
          )
          prediction = model.predict(sample)
          assert prediction.shape == (1,)
          assert prediction[0] in model.classes_
          PY

      - name: Build Docker image
        run: docker build --tag iris-classifier .

  deploy:
    name: Verify Streamlit deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - name: Wait for Streamlit Community Cloud deployment
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          test -n "$STREAMLIT_APP_URL" || {
            echo "Configure the STREAMLIT_APP_URL repository variable first."
            exit 1
          }

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "$STREAMLIT_APP_URL/_stcore/health" > /dev/null; then
              echo "Streamlit app is healthy at $STREAMLIT_APP_URL"
              exit 0
            fi
            echo "Waiting for Streamlit deployment (attempt $attempt/30)..."
            sleep 10
          done

          echo "Streamlit app did not become healthy in time."
          exit 1
